<script>
  const scores = { R: 0, C: 0, S: 0 };
  const answered = {};

  function pick(el, type, q) {
    const card = el.closest('.q-card');
    card.querySelectorAll('.answer').forEach(a => a.classList.remove('selected'));
    el.classList.add('selected');
    if (answered[q]) scores[answered[q]]--;
    scores[type]++;
    answered[q] = type;
  }

  function submitQuiz() {
    if (Object.keys(answered).length < 10) {
      alert('Please answer all 10 questions to unlock your result 🤍');
      return;
    }
    const gate = document.getElementById('emailGate');
    gate.classList.add('visible');
    gate.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function revealResult() {
    const name = document.getElementById('firstName').value.trim();
    const email = document.getElementById('emailAddress').value.trim();

    if (!name || !email) {
      alert('Please enter your name and email to unlock your result 🤍');
      return;
    }

    if (!email.includes('@') || !email.includes('.')) {
      alert('Please enter a valid email address 🤍');
      return;
    }

    let result = 'S';
    if (scores.R > scores.C && scores.R > scores.S) result = 'R';
    else if (scores.C > scores.R && scores.C > scores.S) result = 'C';
    else result = 'S';

    const resultNames = {
      R: 'The Restrictor',
      C: 'The Comfort Seeker',
      S: 'The Swinger'
    };

    // 🔥 SEND TO GOOGLE SHEETS
    fetch("https://script.google.com/macros/s/AKfycbwlWMib6hDFTWc3Kyw2yAyiNeXQ97vHZAMvCbSgppWxaY7SVRUjoW7_i_m3cdn_uF1O/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        name: name,
        email: email,
        result: resultNames[result]
      })
    })
    .then(res => res.text())
    .then(data => console.log("Sheet success:", data))
    .catch(err => console.error("Sheet error:", err));

    // Hide email gate
    document.getElementById('emailGate').style.display = 'none';

    // Show results
    const wrapper = document.getElementById('resultsWrapper');
    wrapper.classList.add('visible');

    document.querySelectorAll('.result-card').forEach(c => c.classList.remove('active'));
    document.getElementById('result-' + result).classList.add('active');

    setTimeout(() => {
      wrapper.scrollIntoView({ behavior: 'smooth' });
    }, 100);
  }
</script>
